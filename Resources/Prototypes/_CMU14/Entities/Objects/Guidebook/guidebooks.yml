# ЗАКОНЫ (военные)
- type: entity
  parent: RMCGuidebookBase
  id: AU14GuidebookLawMarine
  name: единый кодекс военной юстиции
  description: "Обычно это любимое чтение любого сотрудника военной полиции. Его основное предназначение — служить весами для меча правосудия, занесённого на борту кораблей различных вооружённых сил, чтобы поддерживать мир и порядок. Среди его прозвищ встречаются, помимо прочего: «Красная книга Дьявола», «Библия всех грешников», «ТА САМАЯ книга», «ЕКВЮ», «Красный кирпич», «Руководство по пыткам», «Дьявольская красная библия пыток для всех грешников»."
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/Books/Other/marine_law.rsi
  - type: GuideHelp
    guides:
    - AU14UCMJ

# ЗАКОНЫ (колониальные)
- type: entity
  parent: RMCGuidebookBase
  id: AU14GuidebookLawColonial
  name: колониальный гражданский кодекс
  description: "Толстый, потрёпанный и зачитанный том с печатями Орбитального суда и Колониальной администрации. Это историческое первое издание Колониального гражданского кодекса, напечатанное задолго до последних реформ. Его содержание считается устаревшим: страницы полны прецедентов, которые современные юристы оспаривают при помощи сомнительных правовых доводов, и положений, которые никогда не пересматривались. Ни двое юристов не способны прийти к согласию относительно значения хотя бы половины текста. Тем не менее экземпляр этой книги можно найти практически в каждом колониальном учреждении, и она по-прежнему остаётся в обращении, напоминая о том, что право — это живой и постоянно меняющийся механизм. Её с любовью называют «Синей книгой»."
  components:
  - type: Sprite
    sprite: _AU14/Objects/Misc/Books/cclaw.rsi
  - type: GuideHelp
    guides:
    - AU14CCLaw

# СТАНДАРТНЫЕ ОПЕРАЦИОННЫЕ ПРОЦЕДУРЫ
- type: entity
  parent: RMCGuidebookBase
  id: AU14GuidebookSOP
  name: стандартные операционные процедуры
  description: "Одна из важнейших книг на борту любого военного корабля — во всяком случае, именно так вы должны к ней относиться. На её страницах содержатся военные инструкции и процедуры, регулирующие действия личного состава в самых разных ситуациях."
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/Books/Other/SOP.rsi
  - type: GuideHelp
    guides:
    - AU14SOP
