- type: entity
  parent: ColMarTechBase
  id: AU14USCMVehicleCrewmanVendor
  name: vehicle crewman vendor
  description: >-
    An automated dispenser rack, hooked up to a small storage of support gear for vehicle crew.
    Engineered to get vehicle crewmen fight-ready in seconds after cryogenic hypersleep or scramble orders.
    The console shows many different options available, though they are all marked as temporarily out of stock.

    Vehicle crew protocol: grab the essential maintenance jack.
  components:
  - type: AccessReader
    access: [[ "AU14AccessGovforVehicleCrew" ], [ "AU14AccessOpforVehicleCrew" ]]
