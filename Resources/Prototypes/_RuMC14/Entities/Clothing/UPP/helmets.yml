- type: entity
  parent: RMCMarineHelmetBase
  id: RuMCUPPNavalInfantryHeavyHelmet
  name: Maska-S
  description: The helmet for the UPP. It's called a heavy helmet, but the only difference is that the mask feels like it's made of cardboard, so there's not much difference between this and the regular version. [Head, eyes]
  components:
  - type: CMArmor
    melee: 25
    bullet: 40
    bio: 20
    explosionArmor: 12
    # armor_laser = 15
    # armor_energy = 10
    # armor_rad = 10
    # armor_internaldamage = 20
  - type: Sprite
    sprite: _RuMC14/Clothing/UPP/helmet/HeavyHelmet.rsi
    layers:
    - state: icon
      map: [ "unfoldedLayer" ]
    - state: icon-up
      map: ["foldedLayer"]
      visible: false
  - type: Clothing
    sprite: _RuMC14/Clothing/UPP/helmet/HeavyHelmet.rsi
  - type: Foldable
    canFoldInsideContainer: true
  - type: FoldableClothing
    foldedEquippedPrefix: up
    foldedHeldPrefix: up

- type: entity
  parent: RMCMarineHelmetBase
  id: RuMCUPPNavalInfantryHeavyHelmet2
  name: Altyn-S
  description: A heavy assault helmet featuring a wide, curved bulletproof polycarbonate visor. Unlike the Maska, it offers a full, unobstructed field of view, making it ideal for commanders and operators in close-quarters environments. The visor is resistant to most pistol rounds and shrapnel, but can be cracked by sustained heavy fire or blunt impacts. A symbol of elite status and modern protection.
  components:
  - type: CMArmor
    melee: 25
    bullet: 40
    bio: 20
    explosionArmor: 12
    # armor_laser = 15
    # armor_energy = 10
    # armor_rad = 10
    # armor_internaldamage = 20
  - type: Sprite
    sprite: _RuMC14/Clothing/UPP/helmet/2_HeavyHelmet.rsi
    layers:
    - state: icon
      map: [ "unfoldedLayer" ]
    - state: icon-up
      map: ["foldedLayer"]
      visible: false
  - type: Clothing
    sprite: _RuMC14/Clothing/UPP/helmet/2_HeavyHelmet.rsi
  - type: Foldable
    canFoldInsideContainer: true
  - type: FoldableClothing
    foldedEquippedPrefix: up
    foldedHeldPrefix: up

- type: entity
  parent: RMCArmorHelmetMercenary
  id: RuMCUPPHeavyHelmet
  name: 6B83 heavy helmet
  description: EVA-capable enclosed helmet of the UPP's Naval Infantry. Despite offering a higher armor rating, this helmet's cumbersome design kept it from retaining a larger role in the equipment of the Naval Infantry, and instead is largely reserved for heavy weapons operators and other specialist roles. Usually carried alongside with 6B99-2 heavy assault armor.
  components:
  - type: Sprite
    sprite: _AU14/Clothing/UPP/hats/uppheavyhelmet.rsi
  - type: Clothing
    sprite: _AU14/Clothing/UPP/hats/uppheavyhelmet.rsi
