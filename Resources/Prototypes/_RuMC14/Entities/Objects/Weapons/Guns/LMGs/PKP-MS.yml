# Magazines

- type: entity
  parent: CMMagazineRifleBase
  id: RuMCMagazinePKP_MS
  name: PKP-MS box magazine (7.62x54R)
  description: A 150-round belt-fed box magazine for the PKP-MS general-purpose machine gun.
  components:
  - type: Tag
    tags:
    - RuMCMagazinePKP_MS
    - RMCMagazineLMGQYJ72
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - RMCCartridgeLMGQYJ72
    proto: RMCCartridgeLMGQYJ72
    capacity: 200
    deleteWhenEmpty: false
  - type: Sprite
    sprite: _RuMC14/Objects/Weapons/Guns/LMGs/PKP-MS/mag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    #- state: ammo_band
    #  color: "#e5b13c"
  - type: Clothing
    slots:
    - suitStorage
  - type: Item
    size: Large

- type: entity
  parent: RuMCMagazinePKP_MS
  id: RuMCMachineMagazineTracerPKP_MS
  name: PKP-MS box magazine (7.62x54R Tracer)
  description: A 150-round belt-fed tracer box magazine for the PKP-MS general-purpose machine gun.
  components:
  - type: Tag
    tags:
    - RuMCMagazinePKP_MS
    - RMCMagazineLMGQYJ72
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - RuMCCartridge762x54RTracer
      - RMCCartridgeLMGQYJ72
    proto: RuMCCartridge762x54RTracer
    capacity: 200
    deleteWhenEmpty: false
  - type: Sprite
    sprite: _RuMC14/Objects/Weapons/Guns/LMGs/PKP-MS/mag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - state: ammo_band
      color: "#1F951F"
  - type: Clothing
    slots:
    - suitStorage
  - type: Item
    size: Large

