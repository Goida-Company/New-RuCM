- type: entity
  parent: [ CMBaseWeaponRifle, RMCBaseWeaponMagazineVisuals ]
  name: R81M1A pulse rifle
  id: RuMCRifleFAL
  description: The R81M1A highpower pulse rifle is a very popular weapon within the civilian market, previously rejected by the Royal Marine Commandos due to it's slow rate of fire and mediocre accuracy compared to other rifles in its class. However, it remains a favorite among mercenaries and private military contractors for its high damage output and reliability in harsh conditions. Produced by Orion Defence Systems.
  components:
  - type: Item
    size: Huge
  - type: Sprite
    sprite: _RuMC14/Objects/Weapons/Guns/Rifles/FAL/FAL_inhands.rsi
    layers:
    - state: base
      sprite: _RuMC14/Objects/Weapons/Guns/Rifles/FAL/FAL.rsi
    - state: bolt-open
      sprite: _RuMC14/Objects/Weapons/Guns/Rifles/FAL/FAL.rsi
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      sprite: _RuMC14/Objects/Weapons/Guns/Rifles/FAL/FAL.rsi
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Clothing
    sprite: _RuMC14/Objects/Weapons/Guns/Rifles/FAL/FAL_inhands.rsi
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: Gun
    selectedMode: FullAuto
    availableModes:
    - SemiAuto
    - FullAuto
    soundGunshot:
      collection: AU14SLRFireSound
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/lmg_empty.ogg
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    - FullAuto
    recoilUnwielded: 4
    scatterWielded: 5
    scatterUnwielded: 11
    baseFireRate: 2.5
    burstScatterMult: 1
    modifiers:
      FullAuto:
        maxScatterModifier: 10
        unwieldedScatterMultiplier: 2
        shotsToMaxScatter: 5
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 2.35
    accuracyMultiplierUnwielded: 0.55
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: RuMCMagazineFAL
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_reload.ogg
        priority: 2
        whitelist:
          tags:
          - RuMCMagazineFAL
          - RuMCMagazineFALAP
  - type: GunDamageModifier
    multiplier: 1.15
  - type: AttachableHolder
    slots:
      rmc-aslot-barrel:
        locked: true
        startingAttachable: RuMCAttachmentFALBarrel
        whitelist:
          tags:
          - RuMCAttachmentFALBarrel
      rmc-aslot-rail:
        whitelist:
          tags:
          - RMCAttachmentRailFlashlight
          - RMCAttachmentMagneticHarness
          - RMCAttachmentS5RedDotSight
          - RMCAttachmentS6ReflexSight
          - RMCAttachmentS84xTelescopicScope
          - RMCAttachmentS42xTelescopicMiniscope
      rmc-aslot-underbarrel:
        whitelist:
          tags:
          - RMCAttachmentAngledGrip
          - RMCAttachmentGyroscopicStabilizer
          - RMCAttachmentLaserSight
          - RMCAttachmentVerticalGrip
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-rail: -0.05, 0.13
      rmc-aslot-underbarrel: 0.42, -0.26
      rmc-aslot-barrel: 0.5, 0.0045931415
      rmc-aslot-stock: 0.2, -0.2
  - type: ItemCamouflage
    camouflageVariations: { }
  - type: Tag
    tags:
    - RuMCRifleFAL
  - type: Wieldable
  - type: WieldableSpeedModifiers
    base: 0.85
    light: 0.85
    medium: 0.8
    heavy: 0.77
  - type: WieldDelay
    baseDelay: 0.12

