name: Benchmarks
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

concurrency: benchmarks

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.2.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.props
            **/*.targets
            **/packages.lock.json

      - name: Restore benchmarks
        run: dotnet restore Content.Benchmarks/Content.Benchmarks.csproj

      - name: Run benchmarks
        run: dotnet run --project Content.Benchmarks --no-restore --configuration Release -- --filter '*'
